<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NAVJ AI SECURITE</title>
<style>
body{margin:0;font-family:system-ui;background:#050e1e;color:white;overflow-x:hidden}
.water{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 0%,#0a2a5a,#020a17)}
.wave{position:absolute;width:200%;height:300px;background:linear-gradient(90deg,transparent,rgba(0,150,255,0.25),transparent);animation:flow 6s infinite linear;top:10%;border-radius:50%}
.wave2{top:30%;animation-duration:9s;opacity:0.5}.wave3{top:60%;animation-duration:13s;opacity:0.25}
@keyframes flow{0%{transform:translateX(-50%)}100%{transform:translateX(0%)}}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);border-radius:22px;padding:18px;margin:14px}
.avatar{width:120px;height:120px;border-radius:50%;border:4px solid #ffcc00;box-shadow:0 0 25px #0066ff;object-fit:cover}
.btn-gold{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(90deg,#ffcc00,#ff9500);color:#000;font-weight:900;font-size:17px}
.btn-blue{width:100%;padding:14px;border:none;border-radius:12px;background:#0066ff;color:white;font-weight:bold;margin-top:10px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.5);color:white;margin-top:10px;box-sizing:border-box}
.badge{background:gold;color:black;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
</style></head><body>
<div class="water"><div class="wave"></div><div class="wave wave2"></div><div class="wave wave3"></div></div>
<div class="card" style="text-align:center">
<div style="font-size:20px">NAVJ AI SECURITE</div>
<img src="agent.jpg" class="avatar" style="margin-top:12px">
<div style="margin-top:8px;font-weight:bold">PAPA DERA ELLE - Fondateur</div>
<div style="font-size:11px;opacity:0.7">@papaderaelle</div>
<h2>PREMIUM 1000F - A Vie</h2>
<p style="opacity:0.8;font-size:13px">PDF Preuve Illimite + ID Unique<br>Auto apres paiement</p>
<button onclick="payerAuto()" class="btn-gold">PAYER 1000F - ACCES AUTOMATIQUE</button>
</div>
<div class="card">
<div>Mode: <b id="modeText">FREE</b> <span id="badge" class="badge" style="display:none">PREMIUM ACTIF</span></div>
<input id="agent" placeholder="Ton nom d'agent">
<select id="poste"><option>Choisis ton poste</option><option>Agent SGCI Total Treichville</option><option>Agent Rondier</option><option>Chef de poste</option><option>Superviseur</option></select>
<select id="ronde"><option>Ronde RAS</option><option>Ronde avec incident</option><option>Prise de service</option><option>Fin de service</option></select>
<textarea id="faits" rows="4" placeholder="Decris les faits..."></textarea>
<button onclick="generer()" class="btn-blue">GENERER RAPPORT</button>
</div>
<div class="card">
<div id="rapport" style="background:white;color:black;padding:15px;border-radius:10px;min-height:90px;white-space:pre-wrap">Rapport ici...</div>
<button onclick="copier()" style="width:100%;padding:12px;background:#00c851;color:white;border:none;border-radius:10px;margin-top:10px;font-weight:bold">Copier</button>
<button onclick="checkPremium()" style="width:100%;padding:12px;background:gold;color:black;border:none;border-radius:10px;margin-top:10px;font-weight:bold">Telecharger Preuve Premium</button>
</div>
<script>
function payerAuto(){window.open("https://pay.wave.com/m/M_ci_BsVtsF_0PH8q/c/ci/?amount=1000","_blank");setTimeout(()=>{localStorage.setItem('navj_premium','unlocked');document.getElementById('modeText').innerText='PREMIUM';document.getElementById('badge').style.display='inline';alert("Paiement en cours... PREMIUM debloque auto!");location.href="https://navj-ai-securite.github.io/NAVJ-IA-SECURITE/?premium=unlocked";},5000);}
if(localStorage.getItem('navj_premium')=='unlocked' || location.href.includes('premium=unlocked')){document.getElementById('modeText').innerText='PREMIUM';document.getElementById('badge').style.display='inline';}
function generer(){let a=document.getElementById('agent').value||"[Agent]";let p=document.getElementById('poste').value;let r=document.getElementById('ronde').value;let f=document.getElementById('faits').value;document.getElementById('rapport').innerText="RAPPORT NAVJ\nAgent: "+a+"\nPoste: "+p+"\nType: "+r+"\nFaits: "+f+"\nHeure: "+new Date().toLocaleString();}
function copier(){navigator.clipboard.writeText(document.getElementById('rapport').innerText);alert("Copie!");}
function checkPremium(){if(localStorage.getItem('navj_premium')=='unlocked'){alert("PDF Premium pret");}else{payerAuto()}}
</script></body></html>
