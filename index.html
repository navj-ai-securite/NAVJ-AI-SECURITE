<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAVJ AI SECURITE - PAPA DERA ELLE</title>
<style>
body{margin:0;font-family:system-ui;background:#050e1e;color:#fff;padding:12px}
.eau{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;background:radial-gradient(circle at 50% 0%,#00C85333,transparent 60%)}
.vague{position:absolute;width:200%;height:300px;top:0;left:-50%;background:linear-gradient(90deg,transparent,rgba(0,200,83,0.1),transparent);animation:wave 6s infinite}
@keyframes wave{0%{transform:translateX(-50%)}100%{transform:translateX(0%)}}
.avatar{width:120px;height:120px;border-radius:50%;border:4px solid #ffcc00;box-shadow:0 0 20px #ffcc0060}
.bouton-or{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;font-weight:900;font-size:15px}
.bouton-bleu{width:100%;padding:14px;border:none;border-radius:14px;background:#00C853;color:#fff;font-weight:900}
.saisir,.selection{width:100%;padding:12px;border-radius:10px;border:none;margin-top:8px;font-size:14px}
.badge{background:#000;color:#ffcc00;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:900}
.card{background:rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-top:12px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1)}
#rapport{background:white;color:black;padding:15px;border-radius:10px;min-height:80px;white-space:pre-wrap;margin-top:10px}
</style>
</head>
<body>
<div class="eau"><div class="vague"></div><div class="vague" style="animation-delay:1s"></div></div>

<div class="card" style="text-align:center">
<div style="font-size:20px">NAVJ AI SECURITE</div>
<img src="https://ui-avatars.com/api/?name=PAPA+DERA+ELLE&background=ffcc00&color=000&size=200" class="avatar" style="margin-top:12px">
<div style="margin-top:8px">PAPA DERA ELLE - Fondateur</div>
<div style="font-size:11px;opacity:0.7">@papaderaelle</div>
<h2>PREMIUM 1000F - A Vie</h2>
<p style="opacity:0.8;font-size:13px">PDF Preuve Illimite + ID Unique<br>Auto apres paiement</p>
<button onclick="payerAuto()" class="bouton-or">PAYER 1000F - ACCES AUTOMATIQUE</button>
</div>

<div class="card">
<div>Mode: <b id="modeText">GRATUIT</b> <span id="badge" class="badge" style="display:none">PREMIUM ACTIF</span></div>
<input id="agent" placeholder="Ton nom d'agent" class="saisir" value="N'ké Junior">
<select id="poste" class="selection"><option>Choisis ton poste</option><option selected>Agent SGCI Total Treichville</option><option>Agent Shell</option><option>Agent Résidence</option></select>
<select id="ronde" class="selection"><option>Ronde RAS</option><option>Ronde avec incident</option><option>Ronde de nuit</option></select>
<textarea id="faits" rows="4" placeholder="Decris les faits..." class="saisir">Ronde RAS</textarea>

<!-- BLOC VOCAL PREMIUM 2 - A AJOUTER SANS SUPPRIMER L'ANCIEN -->
<div id="vocalPremium2" style="border:2px dashed #00C853;padding:12px;border-radius:10px;margin-top:10px;background:rgba(0,200,83,0.05)">
<label style="font-weight:bold;color:#00C853;">🎤 PREMIUM 2 - Rapport Vocal (Audio + Texte)</label>
<div style="display:flex;gap:8px;margin-top:8px;">
<button id="btnStartVocal" type="button" style="background:#00C853;color:white;border:none;padding:10px 15px;border-radius:8px;font-weight:bold;flex:1">🎤 Démarrer le chant</button>
<button id="btnStopVocal" type="button" style="background:#ff3300;color:white;border:none;padding:10px 15px;border-radius:8px;display:none;flex:1">⏹️ Arrêter la voix</button>
<span id="vocalStatus" style="font-size:13px;color:#333;align-self:center">Clique sur Parler...</span>
</div>
<audio id="audioPlayback" controls style="width:100%;margin-top:8px;display:none"></audio>
<small style="color:#666;">Ton audio sera gardé comme preuve dans le PDF.</small>
</div>

<button onclick="generer()" class="bouton-bleu" style="margin-top:12px">GENERER RAPPORT</button>
</div>

<div class="card">
<div id="rapport">Rapport vide...</div>
<button onclick="copier()" style="width:100%;padding:12px;background:#00C853;color:white;border:none;border-radius:10px;margin-top:12px">📋 Photocopieuse</button>
<button onclick="checkPremium()" style="width:100%;padding:12px;background:orange;color:black;border:none;border-radius:10px;margin-top:8px;font-weight:900">🔓 Vérifier Premium</button>
</div>

<script>
function payerAuto(){window.open("https://pay.wave.com/m/M_ci_BVtsF_0M8q/c/ci/?amount=1000", "_blank");setTimeout(()=>{if(localStorage.getItem('navj_premium')=='unlocked'){location.href=document.URL.split('?')[0]+'?premium=unlocked';}else{alert("Après paiement Wave, ton Premium s'active auto");localStorage.setItem('navj_premium','unlocked');location.reload();}},2000);}
if(localStorage.getItem('navj_premium')=='unlocked' || location.href.includes('premium=unlocked')){document.getElementById('modeText').innerText='PREMIUM';document.getElementById('modeText').style.color='#00C853';document.getElementById('badge').style.display='inline';document.getElementById('badge').innerText='PREMIUM ACTIF';}

function generer(){let a=document.getElementById('agent').value;let p=document.getElementById('poste').value;let r=document.getElementById('ronde').value;let f=document.getElementById('faits').value;let id='NAVJ-'+Date.now().toString().slice(-6);let txt=`🇨🇮 NAVJ AI SECURITE - PREUVE 🇨🇮\n\nID Unique: ${id}\nAgent: ${a}\nPoste: ${p}\nRonde: ${r}\nDate: ${new Date().toLocaleString()}\n\nFAITS:\n${f}\n\nFondé par PAPA DERA ELLE\n@papaderaelle\nPREMIUM 1000F A Vie`;document.getElementById('rapport').innerText=txt;}
function copier(){navigator.clipboard.writeText(document.getElementById('rapport').innerText);alert('Copié!');}
function checkPremium(){if(localStorage.getItem('navj_premium')=='unlocked'){alert('PDF Premium prêt - PREMIUM ACTIF');}else{alert('Pas encore Premium - Clique PAYER 1000F');payerAuto();}}

// ==== MODULE VOCAL PREMIUM 2 - SÉCURISÉ, N'ÉCRASE RIEN ====
let mediaRecorder, audioChunks = [], audioBlob = null;
let recognition;
const btnStart = document.getElementById('btnStartVocal');
const btnStop = document.getElementById('btnStopVocal');
const status = document.getElementById('vocalStatus');
const audioPlayback = document.getElementById('audioPlayback');
const champFaits = document.getElementById('faits');

btnStart.onclick = async () => {
const stream = await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder = new MediaRecorder(stream);
audioChunks = [];
mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
mediaRecorder.onstop = () => {
audioBlob = new Blob(audioChunks, {type:'audio/webm'});
audioPlayback.src = URL.createObjectURL(audioBlob);
audioPlayback.style.display = 'block';
status.textContent = "✅ Audio enregistré + Texte transcrit!";
};
mediaRecorder.start();

// 2. Lancer la transcription vocale (français)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
recognition = new SpeechRecognition();
recognition.lang = 'fr-FR';
recognition.interimResults = true;
recognition.continuous = true;
recognition.onresult = (event) => {
let transcript = '';
for(let i=event.resultIndex; i<event.results.length; i++){
transcript += event.results[i][0].transcript;
}
if(champFaits) champFaits.value = transcript;
status.textContent = "🎧 J'écoute... parle maintenant";
};
recognition.start();
}

btnStart.style.display = 'none';
btnStop.style.display = 'block';
};

btnStop.onclick = () => {
if(mediaRecorder) mediaRecorder.stop();
if(recognition) recognition.stop();
btnStart.style.display = 'block';
btnStop.style.display = 'none';
};
</script>
</body>
</html>
